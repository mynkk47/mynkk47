<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#050816"/>
      <stop offset="0.5" stop-color="#111827"/>
      <stop offset="1" stop-color="#050816"/>
      <animate attributeName="x1" values="0;300;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>

    <linearGradient id="neon" x1="0" y1="0" x2="1200" y2="0">
      <stop stop-color="#22D3EE"/>
      <stop offset="0.5" stop-color="#7C3AED"/>
      <stop offset="1" stop-color="#22D3EE"/>
      <animate attributeName="x1" values="0;1200;0" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1200;0;1200" dur="5s" repeatCount="indefinite"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow">
      <feGaussianBlur stdDeviation="14"/>
    </filter>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#334155" stroke-opacity="0.22"/>
    </pattern>

    <clipPath id="round">
      <rect x="8" y="8" width="1184" height="304" rx="28"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <rect width="1200" height="320" fill="url(#grid)"/>

    <circle cx="160" cy="100" r="100" fill="#7C3AED" fill-opacity="0.14" filter="url(#softGlow)">
      <animate attributeName="cx" values="160;260;160" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="100;190;100" dur="6s" repeatCount="indefinite"/>
    </circle>

    <circle cx="1050" cy="230" r="120" fill="#22D3EE" fill-opacity="0.11" filter="url(#softGlow)">
      <animate attributeName="cx" values="1050;930;1050" dur="8s" repeatCount="indefinite"/>
      <animate attributeName="cy" values="230;100;230" dur="7s" repeatCount="indefinite"/>
    </circle>

    <path d="M-100 270 C180 80 360 380 620 170 S1050 70 1300 220"
          stroke="url(#neon)" stroke-width="2" stroke-opacity="0.7" fill="none">
      <animate attributeName="d"
        values="M-100 270 C180 80 360 380 620 170 S1050 70 1300 220;
                M-100 220 C180 370 380 30 620 210 S1050 300 1300 100;
                M-100 270 C180 80 360 380 620 170 S1050 70 1300 220"
        dur="9s" repeatCount="indefinite"/>
    </path>

    <rect x="8" y="8" width="1184" height="304" rx="28" stroke="url(#neon)" stroke-width="2" stroke-opacity="0.85"/>

    <g font-family="Arial, Helvetica, sans-serif">
      <text x="70" y="105" fill="#94A3B8" font-size="22" letter-spacing="5">HELLO, I'M</text>

      <text x="68" y="170" fill="white" font-size="64" font-weight="700" letter-spacing="2">
        MAYANK
        <animate attributeName="opacity" values="0.75;1;0.75" dur="3s" repeatCount="indefinite"/>
      </text>

      <rect x="72" y="190" width="12" height="30" rx="2" fill="#22D3EE" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
      </rect>

      <text x="100" y="214" fill="#22D3EE" font-size="22" font-weight="600">
        C++  •  DSA  •  PROBLEM SOLVING
      </text>

      <text x="72" y="263" fill="#64748B" font-size="17">
        B.Tech CSE  |  Building • Learning • Improving
      </text>

      <g transform="translate(900 78)">
        <rect width="190" height="155" rx="18" fill="#0F172A" fill-opacity="0.72" stroke="#334155"/>
        <text x="24" y="42" fill="#22D3EE" font-size="15" font-weight="700">MYNKK47</text>
        <text x="24" y="73" fill="#CBD5E1" font-size="14">C++ Developer</text>
        <text x="24" y="100" fill="#CBD5E1" font-size="14">DSA Learner</text>
        <text x="24" y="127" fill="#CBD5E1" font-size="14">Future SDE</text>
        <circle cx="158" cy="36" r="7" fill="#22D3EE" filter="url(#glow)">
          <animate attributeName="r" values="5;9;5" dur="1.5s" repeatCount="indefinite"/>
        </circle>
      </g>

      <text x="1080" y="282" text-anchor="end" fill="#475569" font-size="13" letter-spacing="3">KEEP BUILDING</text>
    </g>
  </g>
</svg>
